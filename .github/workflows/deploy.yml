name: Deploy

on:
  push:
    branches:
      - main   # trigger only when integration/main is merged to main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write   # for ghcr.io image push

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/tuteur-inclusif-api
  IMAGE_RL:  ghcr.io/${{ github.repository_owner }}/tuteur-inclusif-rl

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Build and push Docker images to GitHub Container Registry
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build + push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push RL image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/rl/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_RL }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_RL }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 2. Deploy to staging (always on push to main)
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    # Requires: STAGING_HOST, STAGING_SSH_KEY secrets
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH + Docker Compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/tuteur
            # Pull latest images
            docker pull ${{ env.IMAGE_API }}:${{ needs.build-and-push.outputs.image-tag }}
            docker pull ${{ env.IMAGE_RL }}:${{ needs.build-and-push.outputs.image-tag }}
            # Update image tags in compose override
            export API_IMAGE=${{ env.IMAGE_API }}:${{ needs.build-and-push.outputs.image-tag }}
            export RL_IMAGE=${{ env.IMAGE_RL }}:${{ needs.build-and-push.outputs.image-tag }}
            # Rolling restart (zero downtime for stateless services)
            docker compose pull
            docker compose up -d --no-deps api rl
            # Health check
            sleep 10
            curl --fail http://localhost:8000/health || exit 1
            echo "Staging deploy OK: ${{ needs.build-and-push.outputs.image-tag }}"

  # ─────────────────────────────────────────────────────────────
  # 3. Deploy to production (manual trigger only)
  # ─────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to production
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/tuteur
            docker pull ${{ env.IMAGE_API }}:${{ needs.build-and-push.outputs.image-tag }}
            docker pull ${{ env.IMAGE_RL }}:${{ needs.build-and-push.outputs.image-tag }}
            export API_IMAGE=${{ env.IMAGE_API }}:${{ needs.build-and-push.outputs.image-tag }}
            export RL_IMAGE=${{ env.IMAGE_RL }}:${{ needs.build-and-push.outputs.image-tag }}
            docker compose up -d --no-deps api rl
            sleep 15
            curl --fail https://${{ secrets.PROD_DOMAIN }}/health || exit 1
            echo "Production deploy OK: ${{ needs.build-and-push.outputs.image-tag }}"
