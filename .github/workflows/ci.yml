name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff, Pytest and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff
        run: python -m ruff check app orchestration scripts tests

      - name: Run Pytest
        run: python -m pytest -q

      - name: Check installed dependencies
        run: python -m pip check

  docker:
    name: Build and smoke-test FastAPI image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build FastAPI image
        run: docker build --tag tuteur-inclusif-api:ci .

      - name: Smoke-test FastAPI image
        run: >-
          docker run --rm --entrypoint python tuteur-inclusif-api:ci
          -c "from app.main import app; assert app.title; print(app.title)"
