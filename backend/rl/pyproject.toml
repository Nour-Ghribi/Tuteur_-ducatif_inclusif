[project]
name = "tutor-rl-service"
version = "1.0.0"
description = "LinUCB adaptive recommendation microservice for the inclusive educational tutor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7,<3",
    "numpy>=1.26",
]

[project.optional-dependencies]
linucb = [
    # installed from the repo root: pip install -e ../..
    # provides tuteur.adaptive.policy.LinUCBPolicy
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
