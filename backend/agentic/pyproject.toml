[project]
name = "tutor-agentic"
version = "0.1.0"
description = "Agentic AI orchestration layer (LangGraph) for the Inclusive Educational Tutor"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "fastapi>=0.115",
    "httpx>=0.27,<1",
    "pyyaml>=6",
]

[project.optional-dependencies]
# colour adaptation (daltonize) and image handling
inclusion = ["numpy>=1.26", "pillow>=10"]
# the GenAI + RAG module, installed from the repository root: pip install -e ../..
dev = [
    "numpy>=1.26",
    "pillow>=10",
    "uvicorn>=0.30",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # French text legitimately contains typographic characters
    "E501",  # prose in docstrings/comments; code lines are wrapped by `ruff format`
]

[tool.setuptools.package-data]
"tutor_agentic.genai_ext" = ["prompts/*.yaml"]
