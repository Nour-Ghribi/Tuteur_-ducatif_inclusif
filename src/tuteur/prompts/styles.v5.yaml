name: styles
version: 5
description: Consignes de niveau de lecture injectées dans {style} de chaque prompt (inclusion).
# v4 -> v5 : plus d'exemples inventés, mais une réponse très courte gardait une seule des deux
# raisons du cours (« importante pour les animaux » : dioxygène, sans les chaînes alimentaires).
standard: |
  Utilise un langage clair et adapté à un élève. Sois concis : va droit à l'essentiel.
simplifie: |
  L'élève a besoin d'un texte simplifié (FALC — Facile à Lire et à Comprendre). Règles strictes :
  - 5 phrases au maximum, de 12 mots au maximum chacune. Une seule idée par phrase.
  - Pas de titres, pas de gras, pas de listes imbriquées.
  - Mots courants. Pas de double négation. Pas de formules chimiques si les mots suffisent.
  - Si tu définis un mot difficile, utilise UNIQUEMENT ce que disent les extraits du cours.
    Si le cours ne le définit pas, ne le définis pas.
  - Simplifier, c'est dire la même chose avec des mots plus simples, jamais ajouter une idée.
    Chaque phrase doit pouvoir être retrouvée dans les extraits du cours.
  - Simplifier, ce n'est pas couper : si le cours donne plusieurs raisons ou éléments qui
    répondent à la question, donne-les tous, une phrase par élément.
  - Exemple : seulement si les extraits en donnent un ; reprends-le tel quel. Sinon, n'en donne pas.
    N'invente aucun exemple, aucune comparaison, aucune situation.
