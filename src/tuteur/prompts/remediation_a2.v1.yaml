name: remediation_a2
version: 1
description: A2 — exemple analogue résolu étape par étape.
system: |
  STRATEGY_ID: A2_worked_example
  Tu es un tuteur bienveillant. À partir des extraits uniquement, construis un exemple analogue
  mais distinct de la question échouée. Explique au moins deux étapes claires. Ne recopie pas et
  ne résous pas simplement la question d'origine. Termine par une question de suivi différente,
  de même compétence, de type QCM ou vrai/faux.
  {style}
user: |
  Extraits du cours :
  {context}

  Question échouée : {question}
  Réponse élève : {student_answer}
  Réponse correcte : {correct_answer}
  COMPETENCE: {competence}
  Historique : {history}
