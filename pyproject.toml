[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuteur"
version = "0.1.0"
description = "Tuteur éducatif inclusif — module GenAI + RAG"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "openai>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# ragas 0.4.3 importe des modules retirés de langchain-community 0.4 → on reste en LangChain 0.3.
# Python 3.14 : `scikit-network` n'a pas de wheel → `pip install --no-deps ragas==0.4.3` puis le reste.
eval = [
    "ragas==0.4.3",
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
]

[project.scripts]
tuteur = "tuteur.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tuteur.prompts" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
